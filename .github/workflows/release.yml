# 推送 v* 标签（如 v1.0.0）时，在 Windows 上打包安装程序并发布到 Releases
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: npm test
      # 从 CHANGELOG.md 取出本版本那一节，作为 Release 页面的说明
      - name: Release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$ver" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          {
            echo "body<<NOTES_EOF"
            echo "下载 \`thesis-title-extractor_*_x64-setup.exe\` 双击安装即可（推荐）；\`*.msi\` 适合机房统一部署。支持 Windows 10 / 11。"
            echo
            echo "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "论文题目提取工具 ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
      # GitHub 的附件文件名不支持中文（「论文题目提取工具_…」会变成「_…」），
      # 改成英文文件名，再用中文作为下载页上的显示名称
      - name: Rename release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.assets[] | "\(.id) \(.name)"' |
          while read -r id name; do
            case "$name" in
              *setup.exe) new="thesis-title-extractor_${ver}_x64-setup.exe"; label="论文题目提取工具 v${ver} 安装包（推荐，双击安装）.exe" ;;
              *.msi)      new="thesis-title-extractor_${ver}_x64_zh-CN.msi"; label="论文题目提取工具 v${ver} MSI 安装包（机房批量部署用）.msi" ;;
              *) continue ;;
            esac
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name="$new" -f label="$label" > /dev/null
          done
